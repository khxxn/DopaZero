<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DopaZero DOM fixture</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172322; background: #f5f7f6; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 22px; }
    h1 { margin-top: 0; font-size: 24px; }
    #test-controls, #test-report, #fixture-root { padding: 20px; margin-bottom: 16px; background: white; border: 1px solid #d6dfdb; border-radius: 10px; }
    button { padding: 10px 14px; margin: 2px; cursor: pointer; }
    button:disabled { cursor: wait; }
    #test-summary { font-weight: 700; cursor: pointer; }
    #test-results { padding-left: 28px; line-height: 1.6; }
    .pass { color: #096746; } .fail { color: #b52020; }
    #fixture-root { max-width: 520px; margin: 0 auto; min-height: 250px; }
    #fixture-root header { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 14px; }
    #fixture-root input { padding: 10px; width: 100%; }
    #fixture-root main { padding-top: 10px; }
    #fixture-root a { color: #14543f; }
    #fixture-root nav { display: flex; gap: 20px; padding: 18px 0; }
    #fixture-root :is(ytm-browse, ytd-browse, ytd-watch-flexy, ytm-item-section-renderer,
      ytm-watch-next-secondary-results-renderer, ytd-watch-next-secondary-results-renderer,
      ytm-video-with-context-renderer, ytm-video-renderer, ytd-video-renderer,
      ytm-compact-video-renderer, ytd-compact-video-renderer, ytm-playlist-panel-video-renderer,
      ytm-reel-shelf-renderer, ytm-reel-item-renderer, ytm-shorts-shelf-renderer,
      ytm-comment-thread-renderer, ytm-expandable-video-description-body-renderer,
      ytm-pivot-bar-item-renderer, yt-tab-shape, ytm-tab-shape, ytd-thumbnail,
      yt-lockup-view-model, ytm-lockup-view-model, yt-thumbnail-view-model, ytm-thumbnail-view-model,
      ytm-compact-playlist-renderer, ytm-compact-radio-renderer,
      ytm-channel-featured-video-renderer, ytd-channel-featured-content-renderer,
      ytm-backstage-post-renderer, ytd-backstage-post-renderer,
      ytm-shelf-renderer, ytm-unlisted-card-renderer, ytm-compact-channel-renderer,
      yt-page-header-view-model, yt-content-preview-image-view-model) { display: block; }
    #fixture-root :is(ytm-video-with-context-renderer, ytm-video-renderer, ytd-video-renderer,
      ytm-compact-video-renderer, ytd-compact-video-renderer, ytm-playlist-panel-video-renderer) { padding: 16px 0; border-bottom: 1px solid #eee; }
    #fixture-root [data-test$="title"] { display: block; padding: 6px 0; font-size: 17px; font-weight: 600; }
    .video-thumbnail-container-large, .video-thumbnail-container-compact, ytd-thumbnail {
      width: 100%; height: 140px; background: linear-gradient(135deg, #8caaa0, #dae7e1); margin-bottom: 8px;
    }
    .avatar { width: 28px; height: 28px; vertical-align: middle; border-radius: 50%; margin-right: 8px; background: #e0b585; }
    #movie_player { padding: 35px 15px; background: #182424; color: white; }
    .channel-banner { width: 100%; height: 72px; object-fit: cover; border-radius: 8px; }
    .note { color: #52625b; font-size: 14px; line-height: 1.6; }
    /* Copied from m.youtube.com (2026-10-20, 375px wide): only the rules the
       duration and channel-home layout checks measure. */
    #fixture-root .YtmCompactMediaItemStats { display: inline-block; white-space: nowrap; }
    #fixture-root .YtmCompactMediaItemStats ~ .YtmCompactMediaItemStats::before { content: " · "; }
    #fixture-root .yt-mimic { font: 12px Roboto, Arial, sans-serif; color: #0f0f0f; }
    #fixture-root .yt-mimic a { color: inherit; }
    #fixture-root .yt-mimic :is(lazy-list, ytm-vertical-list-renderer) { display: block; }
    #fixture-root .yt-mimic ytm-item-section-renderer { border-bottom: 1px solid rgba(0, 0, 0, .1); }
    #fixture-root .yt-mimic ytm-channel-featured-video-renderer { margin: 12px 0; padding: 0 12px; }
    #fixture-root .yt-mimic ytm-channel-featured-video-renderer > a { display: block; }
    #fixture-root .yt-mimic .YtmChannelFeaturedVideoRendererTitle { display: flex; margin: 12px 0 3px; font-size: 14px; font-weight: 400; line-height: 17.5px; }
    #fixture-root .yt-mimic ytm-shelf-renderer { border-top: 1px solid rgba(0, 0, 0, .2); padding-top: 12px; }
    #fixture-root .yt-mimic .shelf-header { display: flex; align-items: center; padding: 0 12px; margin-bottom: 8px; }
    #fixture-root .yt-mimic .shelf-header-endpoint { display: flex; align-items: center; flex-grow: 1; }
    #fixture-root .yt-mimic .shelf-title-bar { flex-grow: 1; }
    #fixture-root .yt-mimic .shelf-title { margin: 0 0 3px; font-size: 18px; font-weight: 700; line-height: 26px; }
    #fixture-root .yt-mimic ytm-compact-video-renderer { margin: 12px 0; padding: 0; border: 0; }
    #fixture-root .yt-mimic .YtmCompactMediaItemHost { display: flex; padding: 0 12px; }
    #fixture-root .yt-mimic .YtmCompactMediaItemImage { display: block; flex-shrink: 0; }
    #fixture-root .yt-mimic .YtmCompactMediaItemMetadata { display: flex; flex-grow: 1; min-width: 0; }
    #fixture-root .yt-mimic .YtmCompactMediaItemMetadataContent { display: block; flex-grow: 1; min-width: 0; padding: 0 8px; }
    #fixture-root .yt-mimic .YtmCompactMediaItemHeadline { margin: 0; font-size: 14px; font-weight: 400; line-height: 1.25; }
    #fixture-root .yt-mimic .YtmCompactMediaItemSubhead { font-size: 12px; line-height: 1.25; opacity: .6; }
    /* Playlist card and search Shorts grid boxes as measured on m.youtube.com
       (2026-10-22): the thumbnail link keeps 172x80 and the grid its margins. */
    #fixture-root .yt-mimic .ytLockupViewModelHorizontal { display: flex; padding: 0 16px; }
    #fixture-root .yt-mimic .ytLockupViewModelContentImage { display: block; flex: none; width: 172px; height: 80px; }
    #fixture-root .yt-mimic .ytLockupViewModelMetadata { flex-grow: 1; min-width: 0; }
    #fixture-root .yt-mimic ytm-video-with-context-renderer { margin: 0; padding: 12px 0; border: 0; }
    #fixture-root .yt-mimic grid-shelf-view-model { display: flex; margin: 12px 16px 24px; }
    #fixture-root .yt-mimic .ytGridShelfViewModelGridShelfRow { display: flex; margin: 12px 0 8px; }
  </style>
  <script src="/dopazero-youtube.user.js"></script>
  <script>
    // Exercise document-start with the real script before the body is parsed.
    // This measures our bootstrap contract, not Safari's extension injection delay.
    const startupSnapshot = {
      bodyAbsent: !document.body,
      styleInstalled: Boolean(document.getElementById('dopazero-youtube-style')),
      page: document.documentElement.getAttribute('data-dopazero-page'),
      path: location.pathname.replace(/\/+$/, '') || '/',
    };
  </script>
</head>
<body>
  <section id="test-controls">
    <h1>DopaZero 자동 검증</h1>
    <p class="note">YouTube 모바일 화면의 주요 DOM을 재현한 테스트입니다. 실제 YouTube 접속이나 iPhone Safari 실기기 검증을 대신하지 않습니다. 실제 배포 파일 <code>/dopazero-youtube.user.js</code>를 그대로 불러옵니다.</p>
    <button id="rerun" type="button" disabled>테스트 다시 실행</button>
    <button id="preview-home" type="button" disabled>모바일 홈 미리보기</button>
    <button id="preview-search" type="button" disabled>검색 결과 미리보기</button>
    <button id="preview-watch" type="button" disabled>시청 화면 미리보기</button>
    <button id="preview-channel" type="button" disabled>채널 홈 재현 미리보기</button>
  </section>
  <details id="test-report" aria-live="polite" open>
    <summary id="test-summary">테스트 준비 중…</summary>
    <ol id="test-results"></ol>
  </details>
  <section id="fixture-root" aria-label="재현한 YouTube 화면"></section>
  <script>
    'use strict';
    const fixture = document.getElementById('fixture-root');
    const reportPanel = document.getElementById('test-report');
    const summary = document.getElementById('test-summary');
    const results = document.getElementById('test-results');
    const buttons = Array.from(document.querySelectorAll('#test-controls button'));
    const delay = (milliseconds = 180) => new Promise(resolve => setTimeout(resolve, milliseconds));
    const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
    const get = name => fixture.querySelector(`[data-test="${name}"]`);
    const avatar = '<img class="avatar" data-test="avatar" alt="채널 프로필" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2728%27 height=%2728%27%3E%3Ccircle cx=%2714%27 cy=%2714%27 r=%2714%27 fill=%27tan%27/%3E%3C/svg%3E">';
    // Local SVG with a video-image path marker; no remote image request is made.
    const channelImage = 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%2790%27%3E%3C!--/vi/fixture/default.jpg--%3E%3Crect width=%27160%27 height=%2790%27 fill=%27%23a8aaa5%27/%3E%3C/svg%3E';
    // Banners, avatars and outside images never use the /vi/ video path (yt3.* etc.).
    const nonVideoImage = 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%2790%27%3E%3C!--yt3/fixture/banner--%3E%3Crect width=%27160%27 height=%2790%27 fill=%27%23c9b8a6%27/%3E%3C/svg%3E';
    const header = '<header><strong>YouTube</strong><input data-test="site-search" type="search" aria-label="YouTube 검색" placeholder="검색"></header>';

    function visible(element) {
      if (!element || !element.isConnected) return false;
      for (let current = element; current; current = current.parentElement) {
        const style = getComputedStyle(current);
        if (style.display === 'none' || style.visibility === 'hidden' || style.visibility === 'collapse' || Number(style.opacity) === 0 || current.hidden) return false;
      }
      return element.getClientRects().length > 0;
    }
    function assert(condition, message) { if (!condition) throw new Error(message); }
    // At browser zoom or display scaling other than 100%, layout positions are
    // fractional (12px comes back as 11.9964), so compare pixels with a margin.
    const near = (a, b, margin = 0.5) => Math.abs(a - b) <= margin;
    const px = value => Math.round(value * 100) / 100;
    function shown(name) { assert(visible(get(name)), `${name}: 표시되어야 합니다`); }
    function hidden(name) { assert(get(name), `${name}: 테스트 요소가 없습니다`); assert(!visible(get(name)), `${name}: 숨겨져야 합니다`); }
    function page(expected) { assert(document.documentElement.getAttribute('data-dopazero-page') === expected, `페이지 유형이 ${expected}여야 합니다`); }
    function card(name, { shorts = false, title = '집중해서 볼 영상', tag = 'ytm-video-with-context-renderer', desktop = false } = {}) {
      const href = shorts ? 'https://m.youtube.com/shorts/example' : 'https://m.youtube.com/watch?v=example';
      const thumbnail = desktop
        ? `<ytd-thumbnail data-test="${name}-thumbnail"></ytd-thumbnail>`
        : `<div class="video-thumbnail-container-large" data-test="${name}-thumbnail"></div>`;
      return `<${tag} data-test="${name}"><a data-test="${name}-link" href="${href}">${thumbnail}<span data-test="${name}-title">${title}</span></a>${avatar}<span>예시 채널 · 조회수 123회</span></${tag}>`;
    }
    function homeMarkup() {
      return `${header}<main><ytm-browse><div class="tab-content" tab-identifier="FEwhat_to_watch" data-test="home-root"><div data-test="home-feed">${card('home-video')}<ytm-reel-shelf-renderer data-test="home-shorts">Shorts 추천</ytm-reel-shelf-renderer></div></div></ytm-browse></main>`;
    }
    function searchMarkup() {
      return `${header}<main data-test="search-results">${card('search', { title: '산책하며 듣는 차분한 음악' })}${card('short-result', { shorts: true, title: 'Shorts 예시' })}${card('normal', { title: 'Shorts라는 단어가 있는 일반 영상' })}</main>`;
    }
    function watchMarkup() {
      return `${header}<main><div id="movie_player" data-test="player">▶ 재생 중인 영상</div><h2>현재 시청 중인 영상</h2><ytm-expandable-video-description-body-renderer data-test="description">영상 설명 <a data-test="description-short-link" href="https://m.youtube.com/shorts/description">설명 속 Shorts 링크</a></ytm-expandable-video-description-body-renderer><ytm-comment-thread-renderer data-test="comments">시청자의 댓글 <a data-test="comment-short-link" href="https://m.youtube.com/shorts/comment">댓글 속 링크</a></ytm-comment-thread-renderer><section data-test="playlist">재생목록${card('playlist-video', { tag: 'ytm-playlist-panel-video-renderer' })}</section><ytm-item-section-renderer section-identifier="related-items" data-test="related">추천 영상${card('related-video', { tag: 'ytm-compact-video-renderer' })}</ytm-item-section-renderer><ytm-watch-next-secondary-results-renderer data-test="secondary">다음 영상</ytm-watch-next-secondary-results-renderer></main>`;
    }
    // Signed-in channel homes add a "For You" shelf. Its card tag is not in the
    // script's card list, so only the shared video image path identifies it.
    function forYouShelf() {
      return `<ytm-shelf-renderer data-test="for-you-shelf"><h3>추천</h3><div><ytm-unlisted-card-renderer><div role="button"><yt-thumbnail-view-model class="ytThumbnailViewModelHost" data-test="for-you-thumbnail"><div class="ytThumbnailViewModelImage"><img src="${channelImage}" alt=""></div><span data-test="for-you-duration">17:46</span></yt-thumbnail-view-model></div><h4 data-test="for-you-title">추천 선반의 영상 제목</h4><span>조회수 46만회 · 1년 전</span></ytm-unlisted-card-renderer><ytm-unlisted-card-renderer><div class="unlisted-image"><img src="${channelImage}" alt="" data-test="for-you-unknown-image"></div><h4 data-test="for-you-unknown-title">처음 보는 썸네일 상자의 영상</h4></ytm-unlisted-card-renderer></div></ytm-shelf-renderer>`;
    }
    function channelMarkup() {
      return `${header}<main><p class="note">채널 홈의 검증용 재현 화면 · 실제 YouTube 화면이 아닙니다.</p><img class="channel-banner" src="${nonVideoImage}" data-test="channel-banner" alt="예시 채널 배너"><h2>${avatar}예시 채널</h2><nav><span>홈</span><span>동영상</span></nav><h3>추천 영상</h3><ytm-channel-featured-video-renderer data-test="channel-featured"><div class="video-thumbnail-container-large" data-test="channel-featured-thumbnail"><img src="${channelImage}" alt="대표 영상 썸네일"></div><a href="/watch?v=featured" data-test="channel-featured-title">천천히 배우는 영상 편집</a><span>예시 채널 · 조회수 123회</span><div id="movie_player" data-test="channel-player"><img src="${channelImage}" data-test="channel-player-poster" alt="재생 화면 이미지"><p>▶ 채널 대표 영상 플레이어</p></div></ytm-channel-featured-video-renderer><section data-test="channel-shelf"><a href="/watch?v=relative" data-test="channel-relative-link"><div class="thumbnail-cover" data-test="channel-relative-thumbnail"><img src="${channelImage}" alt="영상 썸네일"></div><span data-test="channel-relative-title">집중해서 듣는 이야기</span></a><a href="https://m.youtube.com/watch?v=absolute" data-test="channel-mobile-link"><div class="video-thumbnail-container-compact" data-test="channel-mobile-thumbnail"></div><span data-test="channel-mobile-title">산책하며 듣는 음악</span></a></section>${forYouShelf()}</main>`;
    }
    // Card structures as served by m.youtube.com on 2026-10-20. The length
    // badge sits inside the thumbnail, which the script hides.
    function timeBadge(text) {
      return text === null ? '' : `<div class="videoThumbnailGroupOverlayBottomLeftRightGroup"><ytm-thumbnail-overlay-time-status-renderer class="ytmThumbnailOverlayTimeStatusRendererHost videoThumbnailGroupTimeStatus"><badge-shape class="ytBadgeShapeHost ytBadgeShapeThumbnailDefault"><div class="ytBadgeShapeText">${text}</div></badge-shape></ytm-thumbnail-overlay-time-status-renderer></div>`;
    }
    function compactVideo(name, { badge = '14:26', byline = '', stats = ['조회수 47만회', '1일 전'] } = {}) {
      const subhead = `${byline ? `<div class="YtmCompactMediaItemByline"><span class="ytAttributedStringHost">${byline}</span></div>` : ''}${stats.map(text => `<div class="YtmCompactMediaItemStats"><span class="ytAttributedStringHost" aria-label="${text}" role="text">${text}</span></div>`).join('')}`;
      return `<ytm-compact-video-renderer class="YtmCompactVideoRendererHost item" data-test="${name}"><div class="YtmCompactMediaItemHost"><a href="/watch?v=${name}" class="YtmCompactMediaItemImage" aria-hidden="true"><ytm-compact-thumbnail class="video-thumbnail-container-compact video-thumbnail-container-compact-rounded" data-test="${name}-thumbnail"><img class="video-thumbnail-img" alt="" src="${channelImage}">${timeBadge(badge)}</ytm-compact-thumbnail></a><div class="YtmCompactMediaItemMetadata"><a href="/watch?v=${name}" class="YtmCompactMediaItemMetadataContent"><h4 class="YtmCompactMediaItemHeadline" data-test="${name}-headline"><span class="ytAttributedStringHost" role="text">목록 영상 제목</span></h4><div class="YtmCompactMediaItemSubhead" aria-hidden="true" data-test="${name}-subhead">${subhead}</div></a></div></div></ytm-compact-video-renderer>`;
    }
    function searchVideo(name, { badge = '54:50', bylines = ['예시 채널', '조회수 55만회', '3일 전'] } = {}) {
      const byline = bylines.map(text => `<span class="ytmBadgeAndBylineRendererItemByline" dir="auto" aria-hidden="true"><span class="ytAttributedStringHost">${text}</span></span>`).join('<span class="ytmBadgeAndBylineRendererSeparator" aria-hidden="true">•</span>');
      return `<ytm-video-with-context-renderer class="item" data-test="${name}"><ytm-media-item><a href="/watch?v=${name}" class="media-item-thumbnail-container" aria-hidden="true"><ytm-thumbnail-cover class="video-thumbnail-container-large rounded-thumbnail" data-test="${name}-thumbnail"><img class="video-thumbnail-img" alt="" src="${channelImage}">${timeBadge(badge)}</ytm-thumbnail-cover></a><div class="media-item-details"><div class="media-item-info"><div class="media-item-metadata"><a href="/watch?v=${name}"><h3 class="media-item-headline" data-test="${name}-headline"><span class="ytAttributedStringHost" role="text">검색 영상 제목</span></h3><div><ytm-badge-and-byline-renderer class="ytmBadgeAndBylineRendererHost" data-test="${name}-byline">${byline}</ytm-badge-and-byline-renderer></div></a></div></div></div></ytm-media-item></ytm-video-with-context-renderer>`;
    }
    function playlistVideo(name, { badge = '14:37' } = {}) {
      const badgeHtml = badge === null ? '' : `<yt-thumbnail-bottom-overlay-view-model class="ytThumbnailBottomOverlayViewModelHost"><div class="ytThumbnailBottomOverlayViewModelBadgeContainer"><yt-thumbnail-badge-view-model class="ytThumbnailBadgeViewModelHost"><badge-shape class="ytBadgeShapeHost" role="img" aria-label="길이"><div class="ytBadgeShapeText" aria-hidden="true">${badge}</div></badge-shape></yt-thumbnail-badge-view-model></div></yt-thumbnail-bottom-overlay-view-model>`;
      return `<yt-lockup-view-model class="ytLockupViewModelWrapper" data-test="${name}"><div class="ytLockupViewModelHost ytLockupViewModelHorizontal"><a href="/watch?v=${name}&amp;list=PLexample" class="ytLockupViewModelContentImage" aria-hidden="true"><yt-thumbnail-view-model class="ytThumbnailViewModelHost" data-test="${name}-thumbnail"><div class="ytThumbnailViewModelImage"><img alt="" src="${channelImage}"></div>${badgeHtml}</yt-thumbnail-view-model></a><div class="ytLockupViewModelMetadata"><yt-lockup-metadata-view-model><div class="ytLockupMetadataViewModelTextContainer"><h3 class="ytLockupMetadataViewModelHeadingReset"><a href="/watch?v=${name}&amp;list=PLexample" class="ytLockupMetadataViewModelTitle" data-test="${name}-headline"><span class="ytAttributedStringHost">재생목록 영상 제목</span></a></h3><div class="ytLockupMetadataViewModelMetadata"><yt-content-metadata-view-model class="ytContentMetadataViewModelHost"><div class="ytContentMetadataViewModelMetadataRow" role="group" data-test="${name}-channel"><span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytContentMetadataViewModelMetadataTextLastPart" dir="auto" role="text">준우</span></div><div class="ytContentMetadataViewModelMetadataRow" role="group" data-test="${name}-row"><span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText" dir="auto" role="text">조회수 212만회</span><span aria-hidden="true" class="ytContentMetadataViewModelDelimiter"> • </span><span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytContentMetadataViewModelMetadataTextLastPart" dir="auto" aria-label="4년 전" role="text">4년 전</span></div></yt-content-metadata-view-model></div></div></yt-lockup-metadata-view-model></div></div></yt-lockup-view-model>`;
    }
    const featuredLabel = '카이스트 다닌단 남친 구라같아서 대학 단톡팠더니.. 게시자: 준우 조회수 1,411,788회 5개월 전 12분 18초';
    const liveLabel = '24/7 halloween ambience 🎃 spooky lofi to get chills to 게시자: Lofi Girl 4.8천명 시청 중';
    // Channel home: page header with the subscribe button, the featured video
    // section, then the "동영상" shelf, nested as on m.youtube.com.
    function channelHome(label, { subscribe = '구독' } = {}) {

          assert(ours[property] === shelf[property], `머리글 ${property}가 "동영상"과 같아야 합니다 (${ours[property]} / ${shelf[property]})`);
        }
        assert(ours.fontSize === '18px' && ours.lineHeight === '26px' && ours.fontWeight === '700', '머리글은 18px/26px 굵게(700)여야 합니다');
        const box = element => element.getBoundingClientRect();
        assert(near(box(heading).left, box(get('ch-shelf-heading')).left), '두 머리글은 같은 왼쪽 선에 있어야 합니다');
        assert(near(box(heading).height, box(get('ch-shelf-header')).height), '머리글 높이(아래 3px 포함)가 "동영상"과 같아야 합니다');
        const ourGap = box(get('ch-featured-heading')).top - box(heading).bottom;
        const shelfGap = box(get('ch-list-headline')).top - box(get('ch-shelf-header')).bottom;
        assert(near(ourGap, shelfGap) && near(ourGap, 12), `머리글 아래부터 제목까지 12px이어야 합니다 (${px(ourGap)} / ${px(shelfGap)})`);
        const listLeft = box(get('ch-list-headline')).left;
        assert(near(box(get('ch-featured-heading')).left, listLeft), `대표 영상 제목이 목록 제목과 같은 선에서 시작해야 합니다 (${px(box(get('ch-featured-heading')).left)} / ${px(listLeft)})`);
        const info = added(get('ch-featured'), 'featured-info')[0];
        assert(info && near(box(info).left, listLeft), '대표 영상 정보 줄도 목록 제목과 같은 선이어야 합니다');
        const infoStyle = getComputedStyle(info);
        const listStyle = getComputedStyle(get('ch-list-subhead'));
        for (const property of ['font-size', 'line-height', 'opacity', 'color']) {
          assert(infoStyle[property] === listStyle[property], `정보 줄 ${property}가 목록 정보 줄과 같아야 합니다 (${infoStyle[property]} / ${listStyle[property]})`);
        }
      }],
      ['숨긴 썸네일 자리의 인라인 미리보기는 재생되자마자 멈추고, 시청 화면 재생은 그대로', async () => {
        // m.youtube.com moves its one shared player into a card for a muted
        // preview: the preview portal for videos, the thumbnail's shim for
        // stacked playlist cards. play() often fires before the move.
        await mount('/results?search_query=lofi', `${header}<main>${searchVideo('preview-card').replace('</ytm-media-item>', '</ytm-media-item><div id="video-preview-portal"><ytm-video-preview class="ytmVideoPreviewHost ytmVideoPreviewHostShow"><div class="ytmVideoPreviewPlayer" data-test="preview-slot"></div></ytm-video-preview></div>')}<ytm-video-with-context-renderer><ytm-media-item><a href="/playlist?list=PLexample" class="media-item-thumbnail-container"><yt-collections-stack><ytm-thumbnail-cover class="video-thumbnail-container-large" data-test="stack-thumbnail"><img src="${channelImage}" alt=""><div class="video-preview-shim" data-test="shim-slot"></div></ytm-thumbnail-cover></yt-collections-stack></a><span data-test="stack-headline">재생목록 제목</span></ytm-media-item></ytm-video-with-context-renderer><div id="player-container-id" data-test="watch-slot"></div></main>`);
        get('watch-slot').innerHTML = '<div id="movie_player" class="html5-video-player" data-test="shared-player"><div class="html5-video-container"><video class="video-stream" muted playsinline data-test="shared-video"></video></div></div>';
        const video = get('shared-video');
        let pauses = 0;
        // Count the script's pause() calls; synthetic events stand in for playback.
        video.pause = function () { pauses += 1; return HTMLMediaElement.prototype.pause.call(this); };
        const play = async (slot, ...types) => {
          get(slot).append(get('shared-player'));
          types.forEach(type => video.dispatchEvent(new Event(type)));
          await Promise.resolve();
        };
        await play('preview-slot', 'play');
        assert(pauses === 1, `미리보기 자리에서 재생이 시작되면 바로 멈춰야 합니다 (pause ${pauses}회)`);
        await play('watch-slot', 'play');
        await play('preview-slot', 'playing');
        assert(pauses === 2, `시청 자리에서 play() 뒤 미리보기로 옮겨 재생돼도 멈춰야 합니다 (pause ${pauses}회)`);
        await play('shim-slot', 'playing');
        assert(pauses === 3, `재생목록 썸네일 안에서 재생돼도 멈춰야 합니다 (pause ${pauses}회)`);
        await play('watch-slot', 'play', 'playing');
        assert(pauses === 3, '시청 화면으로 옮긴 플레이어는 멈추면 안 됩니다');
        hidden('stack-thumbnail'); shown('preview-card-headline'); shown('stack-headline');
      }],
      ['재생목록: 숨긴 썸네일 자리를 접어 제목이 카드 왼쪽부터 시작', async () => {
        await mount('/playlist?list=PLexample', `${header}<main class="yt-mimic">${playlistVideo('fold')}<ytm-expandable-video-description-body-renderer>${playlistVideo('fold-kept')}</ytm-expandable-video-description-body-renderer></main>`);
        hidden('fold-thumbnail');
        assert(!visible(get('fold').querySelector('.ytLockupViewModelContentImage')), '썸네일을 숨긴 링크 자리(172×80)도 접혀야 합니다');
        const contentLeft = get('fold').querySelector('.ytLockupViewModelHost').getBoundingClientRect().left + 16;
        const titleLeft = get('fold-headline').getBoundingClientRect().left;
        assert(near(titleLeft, contentLeft), `제목이 카드 안쪽 여백 바로 뒤에서 시작해야 합니다 (${px(titleLeft)} / ${px(contentLeft)})`);
        assert(get('fold-headline').matches('a[href^="/watch"]'), '제목 링크로 영상에 들어갈 수 있어야 합니다');
        shown('fold-kept-thumbnail');
        assert(visible(get('fold-kept').querySelector('.ytLockupViewModelContentImage')), '썸네일을 숨기지 않는 영역의 카드는 그대로여야 합니다');
      }],
      ['검색: Shorts만 담은 그리드 틀을 숨겨 결과 사이 빈 띠를 없애고, 일반 영상이 섞인 그리드는 유지', async () => {
        const shortsItem = id => `<div class="ytGridShelfViewModelGridShelfItem"><ytm-shorts-lockup-view-model class="shortsLockupViewModelHost"><a href="/shorts/${id}" class="shortsLockupViewModelHostEndpoint reel-item-endpoint"><div class="shortsLockupViewModelHostThumbnailParentContainer"><yt-thumbnail-view-model class="ytThumbnailViewModelHost"><div class="ytThumbnailViewModelImage"><img alt="" src="${channelImage}"></div></yt-thumbnail-view-model></div></a></ytm-shorts-lockup-view-model></div>`;
        const grid = (name, items) => `<grid-shelf-view-model class="ytGridShelfViewModelHost item" data-test="${name}"><div><div class="ytGridShelfViewModelGridShelfRow item">${items}</div></div><div class="ytGridShelfViewModelGridShelfBottomButtonContainer"></div></grid-shelf-view-model>`;
        await mount('/results?search_query=lofi', `${header}<main class="yt-mimic"><ytm-item-section-renderer><lazy-list>${searchVideo('grid-before')}${grid('shorts-grid', shortsItem('s1') + shortsItem('s2'))}${searchVideo('grid-after')}${grid('mixed-grid', `${shortsItem('s3')}<div class="ytGridShelfViewModelGridShelfItem">${playlistVideo('grid-video')}</div>`)}</lazy-list></ytm-item-section-renderer></main>`);
        hidden('shorts-grid');
        const gap = get('grid-after').getBoundingClientRect().top - get('grid-before').getBoundingClientRect().bottom;
        assert(near(gap, 0), `Shorts 틀이 있던 자리에 빈 띠가 남으면 안 됩니다 (${px(gap)}px)`);
        ['mixed-grid', 'grid-video-headline', 'grid-before-headline', 'grid-after-headline'].forEach(shown);
      }],
      ['내 페이지: 이미지가 아직 안 불러와진 기록·재생목록 카드도 썸네일과 재생목록 겹침 칸을 접음', async () => {
        // Same nesting as the signed-in m.youtube.com/feed/you carousels
        // (2026-10-25). Off-screen cards have no image address yet.
        await mount('/feed/you', `${header}<main><ytm-item-section-renderer><ytm-horizontal-card-list-renderer><ytm-video-card-renderer class="horizontal-card-list-card"><a class="video-card-image" href="/watch?v=history&amp;t=8"><ytm-compact-thumbnail class="video-thumbnail-container-compact video-thumbnail-container-compact-rounded" data-test="you-history-thumbnail"><img class="video-thumbnail-img" alt="">${timeBadge('14:26')}</ytm-compact-thumbnail></a><div class="video-card-metadata"><a class="video-card-title-container" href="/watch?v=history&amp;t=8"><h4 class="video-card-title" data-test="you-history-title">기록 영상 제목</h4><div class="video-card-subhead"><div class="video-card-subhead-item"><span>예시 채널</span></div><div class="video-card-subhead-item"><span>조회수 56만회 · 2일 전</span></div></div></a></div></ytm-video-card-renderer></ytm-horizontal-card-list-renderer></ytm-item-section-renderer><ytm-item-section-renderer><ytm-horizontal-card-list-renderer><ytm-playlist-card-renderer class="horizontal-card-list-card" data-test="you-playlist"><a class="playlist-card-image stacked" href="/playlist?list=LL" data-test="you-playlist-image"><yt-collections-stack class="ytCollectionsStackHost"><div><div class="ytCollectionsStackCollectionStack1 ytCollectionsStackCollectionStack1Medium" data-test="you-playlist-stack"></div><ytm-compact-thumbnail class="video-thumbnail-container-compact video-thumbnail-container-compact-rounded stacked" data-test="you-playlist-thumbnail"><img class="video-thumbnail-img" alt=""></ytm-compact-thumbnail></div></yt-collections-stack></a><div class="playlist-card-metadata"><a class="playlist-card-title-container" href="/playlist?list=LL"><h4 class="playlist-card-title" data-test="you-playlist-title">좋아요 표시한 동영상</h4><div class="playlist-card-subhead"><div class="playlist-card-byline"><span>비공개 · 재생목록</span></div></div></a></div></ytm-playlist-card-renderer></ytm-horizontal-card-list-renderer></ytm-item-section-renderer></main>`);
        page('other');
        hidden('you-history-thumbnail'); shown('you-history-title');
        hidden('you-playlist-thumbnail');
        assert(!visible(get('you-playlist-image')), '재생목록 카드의 겹침 장식이 든 썸네일 칸도 접혀야 합니다');
        hidden('you-playlist-stack');
        shown('you-playlist-title');
        assert(get('you-playlist-title').closest('a[href^="/playlist"]'), '재생목록 제목 링크는 그대로여야 합니다');
      }],
    ];

    async function run() {
      buttons.forEach(button => { button.disabled = true; });
      reportPanel.open = true;
      summary.className = '';
      window.dopaZeroTestResults = { completed: false };
      results.replaceChildren();
      const report = [];
      summary.textContent = `검증 중… 0 / ${tests.length}`;
      for (const [name, test] of tests) {
        const row = document.createElement('li');
        try {
          await test(); row.className = 'pass'; row.textContent = `PASS · ${name}`; report.push({ name, status: 'PASS' });
        } catch (error) {
          row.className = 'fail'; row.textContent = `FAIL · ${name} — ${error.message}`; report.push({ name, status: 'FAIL', error: error.message });
        }
        results.append(row);
        summary.textContent = `검증 중… ${report.length} / ${tests.length}`;
      }
      const passed = report.filter(test => test.status === 'PASS').length;
      const failed = report.length - passed;
      summary.textContent = `${failed ? 'FAIL' : 'PASS'} · ${passed}/${report.length} 통과${failed ? ` · ${failed}개 실패` : ''}`;
      summary.className = failed ? 'fail' : 'pass';
      reportPanel.open = failed > 0;
      // Readable by browser tools; this reports fixture results only.
      window.dopaZeroTestResults = { completed: true, passed, failed, total: report.length, tests: report };
      await mount('/', homeMarkup());
      buttons.forEach(button => { button.disabled = false; });
    }

    async function preview(url, html) {
      await mount(url, html);
      fixture.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.getElementById('rerun').addEventListener('click', run);
    document.getElementById('preview-home').addEventListener('click', () => preview('/', homeMarkup()));
    document.getElementById('preview-search').addEventListener('click', () => preview('/results?search_query=music', searchMarkup()));
    document.getElementById('preview-watch').addEventListener('click', () => preview('/watch?v=example', watchMarkup()));
    document.getElementById('preview-channel').addEventListener('click', () => preview('/@example/featured', channelMarkup()));
    // Keep preview interactions in this local fixture; never follow mock external video links.
    fixture.addEventListener('click', event => {
      const anchor = event.target.closest('a[href]');
      if (!anchor) return;
      event.preventDefault();
      const url = new URL(anchor.href);
      if (url.pathname === '/feed/subscriptions') mount('/feed/subscriptions', `${header}${card('subscribed')}`);
      else if (url.pathname === '/watch') mount('/watch?v=example', watchMarkup());
    });
    fixture.addEventListener('submit', event => {
      event.preventDefault();
      const query = new FormData(event.target).get('search_query');
      if (String(query || '').trim()) mount(`/results?search_query=${encodeURIComponent(query)}`, searchMarkup());
    });
    run();
  </script>
</body>
</html>
